# Railway monorepo configuration
# Docs: https://docs.railway.com/reference/config-as-code
#
# This file is used by the SERVICE currently being deployed.
# Set the correct dockerfilePath in the Railway dashboard per service,
# or use the service-level overrides below.
#
# ── API Service ────────────────────────────────────────────────────────────────
# Required environment variables:
#   DATABASE_URL   → from Railway PostgreSQL plugin (auto-injected)
#   REDIS_URL      → from Railway Redis plugin (auto-injected)
#   JWT_SECRET     → generate: openssl rand -base64 48
#   CORS_ORIGIN    → https://<your-web-service>.up.railway.app
#   PORT           → 3001
#   NODE_ENV       → production
#
# ── Web Service ────────────────────────────────────────────────────────────────
# Required build variables:
#   VITE_API_URL   → https://<your-api-service>.up.railway.app

[build]
builder = "dockerfile"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckTimeout = 60
restartPolicyType = "on_failure"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320">
  <rect width="200" height="320" fill="#f8fafc"/>

  <!-- Head -->
  <circle cx="100" cy="45" r="35" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="88" cy="40" r="5" fill="#1f2937"/>
  <circle cx="112" cy="40" r="5" fill="#1f2937"/>
  <circle cx="90" cy="38" r="2" fill="white"/>
  <circle cx="114" cy="38" r="2" fill="white"/>
  <!-- Mouth -->
  <path d="M 88 55 Q 100 65 112 55" stroke="#92400e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="65" cy="45" rx="8" ry="12" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
  <ellipse cx="135" cy="45" rx="8" ry="12" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="88" y="76" width="24" height="16" rx="5" fill="#fcd34d"/>

  <!-- Torso -->
  <rect x="55" y="88" width="90" height="105" rx="12" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <!-- Shirt detail -->
  <line x1="100" y1="92" x2="100" y2="188" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="80" y="92" width="40" height="20" rx="4" fill="#60a5fa"/>

  <!-- Left arm -->
  <rect x="20" y="90" width="38" height="20" rx="10" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Left forearm -->
  <rect x="8" y="106" width="32" height="18" rx="9" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
  <!-- Left hand -->
  <ellipse cx="16" cy="125" rx="12" ry="9" fill="#fcd34d" stroke="#d97706" stroke-width="1"/>

  <!-- Right arm -->
  <rect x="142" y="90" width="38" height="20" rx="10" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Right forearm -->
  <rect x="160" y="106" width="32" height="18" rx="9" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
  <!-- Right hand -->
  <ellipse cx="184" cy="125" rx="12" ry="9" fill="#fcd34d" stroke="#d97706" stroke-width="1"/>

  <!-- Waist/Belt -->
  <rect x="55" y="185" width="90" height="16" rx="4" fill="#1e3a5f"/>
  <rect x="93" y="186" width="14" height="14" rx="2" fill="#f59e0b"/>

  <!-- Left leg -->
  <rect x="58" y="196" width="34" height="80" rx="10" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
  <!-- Left shin -->
  <rect x="60" y="255" width="30" height="45" rx="8" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1"/>
  <!-- Left foot -->
  <ellipse cx="68" cy="300" rx="20" ry="10" fill="#1e293b"/>

  <!-- Right leg -->
  <rect x="108" y="196" width="34" height="80" rx="10" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
  <!-- Right shin -->
  <rect x="110" y="255" width="30" height="45" rx="8" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1"/>
  <!-- Right foot -->
  <ellipse cx="132" cy="300" rx="20" ry="10" fill="#1e293b"/>
</svg>
